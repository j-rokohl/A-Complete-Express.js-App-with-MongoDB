<div class="column is-one-third">
    <a href="#" style="text-decoration: none; color: inherit; display: block; height: 100%;">
        <div class="card" style="height: 100%; display: flex; flex-direction: column;" >
            <div class="card-image"> 
                <figure class="image">
                    <img src="{{PHOTO}}" alt="{{NAME}}" >
                </figure>
            </div>
            <div class="card-content" style="flex-grow: 1;">
                <span class="tag is-warning is-light mb-2">{{CATEGORY}}</span>
                <p class="title is-4">{{NAME}}</p>
                <p class="subtitle is-6  has-text-weight-bold has-text-warning-dark pt-3">${{PRICE}}</p>
                <p class="is-size-7">{{DESCRIPTION}}</p>
            </div>
        </div>
    </a>
</div>
